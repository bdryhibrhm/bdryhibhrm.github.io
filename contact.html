<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Contact</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .serif-font { font-family: 'Times New Roman', Times, serif; }
        
        /* Header & Footer */
        .header, .footer { background-color: #3b3b3b; color: white; padding: 25px 80px; display: flex; justify-content: space-between; align-items: center; }
        .header .logo, .footer .logo { font-size: 28px; letter-spacing: 2px; }
        .nav a { color: #ddd; text-decoration: none; margin-left: 30px; font-size: 14px; }
        .nav a.active { color: #5c85d6; border-bottom: 2px solid #5c85d6; padding-bottom: 5px; }
        .footer { background-color: #1a1a1a; margin-top: 0; font-size: 14px; color: #aaa; padding: 40px 80px;}
        
        /* Main Layout */
        .main-content { background-image: radial-gradient(#e5e7eb 2px, transparent 2px); background-size: 35px 35px; min-height: 70vh; padding: 80px; background-color: #fff; }
        
        /* Title */
        .page-title { color: #0033a0; font-size: 36px; margin-bottom: 60px; font-weight: normal; }
        
        /* Contact Grid */
        .contact-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .contact-card { background-color: #bacbfe; padding: 50px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 220px; border-radius: 8px; }
        .contact-icon { width: 50px; height: 50px; margin-bottom: 30px; object-fit: contain; }
        .contact-card p { color: #0033a0; font-weight: bold; font-size: 15px; margin: 0; word-break: break-all; }
        .contact-card .serif-font { font-size: 16px; }

        /* =========================================
           RESPONSIVE DESIGN (Media Queries)
           ========================================= */

        /* Tablet Layout (Lebar layar maksimal 900px) */
        @media screen and (max-width: 900px) {
            .contact-grid {
                grid-template-columns: repeat(2, 1fr); /* Ubah menjadi 2 kolom */
            }
            .header, .footer {
                padding: 25px 40px;
            }
            .main-content {
                padding: 50px 40px;
            }
        }

        /* Mobile Layout (Lebar layar maksimal 600px) */
        @media screen and (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }
            .nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
            .nav a {
                margin-left: 0; /* Hapus margin kiri agar menu rapi di tengah */
            }
            .main-content {
                padding: 40px 20px; /* Kurangi padding utama */
            }
            .page-title {
                font-size: 28px;
                margin-bottom: 30px;
                text-align: center; /* Posisikan judul di tengah untuk HP */
            }
            .contact-grid {
                grid-template-columns: 1fr; /* Ubah menjadi 1 kolom (menumpuk ke bawah) */
            }
            .footer {
                flex-direction: column;
                text-align: center;
                gap: 10px;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo serif-font">PORTFOLIO</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="instagram.html">Skills</a>
            <a href="#" class="active">Contact</a>
        </nav>
    </header>

    <div class="main-content">
        <h1 class="page-title serif-font">Contact Person</h1>
        
        <div class="contact-grid">
            <!-- Instagram -->
            <div class="contact-card">
                <img src="FOTO\instagram.png" alt="Instagram" class="contact-icon">
                <p class="serif-font">@bdryh.ibrhm_</p>
            </div>
            <!-- WhatsApp -->
            <div class="contact-card">
                <img src="FOTO\whatsapp.png" alt="WhatsApp" class="contact-icon">
                <p class="serif-font">+62 823-2211-3967</p>
            </div>
            <!-- Email -->
            <div class="contact-card">
                <img src="FOTO\email.png" alt="Email" class="contact-icon">
                <p class="serif-font">bdryh.ibrhm21@gmail.com</p>
            </div>
            <!-- LinkedIn -->
            <div class="contact-card">
                <img src="FOTO\linked.png" alt="LinkedIn" class="contact-icon">
                <p class="serif-font">Badriyah Ibrahim</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="logo serif-font">PORTFOLIO</div>
        <div>© 2026 Portfolio. All rights reserved.</div>
    </footer>

</body>
</html>
